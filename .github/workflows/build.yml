name: Gerar o executável (Windows)

on:
  workflow_dispatch:      # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CLAUDE.md"
      # "tests/**" NÃO entra aqui: mudança em teste tem que disparar a build,
      # senão o job `test` abaixo nunca roda justamente no push que o alterou.
      # "requirements-dev.txt" também NÃO entra, pelo mesmo motivo: é dele que
      # saem o pytest e o vermin que o job `test` usa. Ignorá-lo enquanto a
      # build o instalava era dizer que mexer na régua do CI não muda nada.

# Leitura para todos; escrita SÓ no job que publica. Os jobs `test` e `motor`
# apenas leem o repositório, e token de escrita à toa é permissão que uma ação
# de terceiro (ou um passo com erro) pode gastar sem ninguém pedir.
permissions:
  contents: read

# Duas builds ao mesmo tempo publicam releases fora de ordem: se a segunda
# terminar primeiro, ela cria a release mais nova antes — e a poda, que ordena
# por data de CRIAÇÃO, apaga a errada. `cancel-in-progress: false` porque a
# build cancelada já consumiu o número dela, e cancelar depois de publicar
# deixaria a release meio publicada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A build publica uma release que os usuários baixam sozinhos ao abrir o app.
  # Testar DEPOIS disso não serve para nada, então o build depende deste job.
  test:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # O exe roda Python 3.11 e a máquina de quem desenvolve, não. Foi assim
      # que a run #76 caiu (`Path.read_text(newline=…)`, que só existe do 3.13
      # em diante) e queimou o número da release. Era passo humano, escrito no
      # CLAUDE.md; agora é do CI. Vale o repositório INTEIRO, `tests/` incluído
      # — a run #76 morreu num arquivo de teste.
      - name: Conferir que o código roda em Python 3.11 (vermin)
        run: vermin --target=3.11 --no-tips --violations .

      - name: Rodar os testes
        run: python -m pytest tests -q

  motor:
    # Código novo rodando em motor velho quebra na máquina do usuário, e a
    # falha aparece longe daqui. Ver CLAUDE.md, "Regra de ouro".
    runs-on: ubuntu-latest
    steps:
      # Antes de qualquer coisa, e num job que leva segundos: sem este token a
      # release sai só no repositório de CÓDIGO, e o `atualizador.py` procura
      # no de ARTEFATOS. O app não vê, ninguém recebe, e nada acusa.
      #
      # Foi o que aconteceu entre 14 e 17/08/2026: o passo que copia a release
      # era condicional (`if: tem_token == 'sim'`), o secret não existia, e o
      # passo foi PULADO — status verde, release publicada, apps órfãos por
      # três dias. Uma release que o app não enxerga não é uma release; então
      # isto derruba a build em vez de deixar passar.
      - name: Exigir o token do repositório de artefatos
        env:
          TOKEN_ARTEFATOS: ${{ secrets.TOKEN_ARTEFATOS }}
        run: |
          if [ -z "${TOKEN_ARTEFATOS:-}" ]; then
            echo "::error::Falta o secret TOKEN_ARTEFATOS. Sem ele a release"
            echo "::error::não chega em ${{ github.repository_owner }}/comprovantes-releases,"
            echo "::error::que é onde o app procura — e ninguém recebe a atualização."
            echo "::error::Crie um fine-grained PAT com Contents: Read and write"
            echo "::error::nesse repositório e rode:"
            echo "::error::  gh secret set TOKEN_ARTEFATOS --repo ${{ github.repository }}"
            exit 1
          fi
          echo "token dos artefatos: presente"

      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Histórico inteiro: a trava compara o INTERVALO do push, e um push
          # com cinco commits precisa dos cinco. Com `fetch-depth: 2` só existia
          # o último, e bastava a ordem dos commits mudar para a trava aprovar
          # um push que mexe no motor sem subir a versão mínima.
          fetch-depth: 0

      - name: Exigir motor_minimo.txt quando o motor muda
        shell: bash
        env:
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
        run: |
          set -uo pipefail
          zeros=0000000000000000000000000000000000000000
          if [ -n "${ANTES:-}" ] && [ "$ANTES" != "$zeros" ] \
             && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            # O intervalo REAL do push, que o GitHub já entrega no evento.
            intervalo="${ANTES}..${AGORA}"
          elif git rev-parse -q --verify "${AGORA}^" >/dev/null; then
            # Primeiro push da branch (o `before` vem zerado), force-push, ou
            # execução manual pela aba Actions: não há intervalo confiável, e a
            # janela examinada encolhe para um commit. Fica avisado no log,
            # porque aqui a trava enxerga menos do que deveria.
            echo "::warning::sem 'before' utilizável ('${ANTES}') — a trava vai"
            echo "::warning::examinar apenas o commit ${AGORA}"
            intervalo="${AGORA}^..${AGORA}"
          else
            echo "primeiro commit do repositório — nada a comparar"; exit 0
          fi
          mudou="$(git diff --name-only "$intervalo")"
          echo "Arquivos deste push ($intervalo):"; echo "$mudou"
          exige=0
          for f in motor.py atualizador.py requirements.txt .github/workflows/build.yml; do
            if echo "$mudou" | grep -qx "$f"; then
              echo "::notice::'$f' mudou — exige motor_minimo.txt novo"
              exige=1
            fi
          done
          if [ "$exige" = "1" ] && ! echo "$mudou" | grep -qx "motor_minimo.txt"; then
            echo "::error::Este push altera o MOTOR mas não sobe motor_minimo.txt."
            echo "::error::Sem isso, o código novo roda em motor velho na máquina"
            echo "::error::do usuário e quebra. Suba motor_minimo.txt para a versão"
            echo "::error::desta release (v2.0.${{ github.run_number }}) no MESMO push."
            exit 1
          fi
          echo "trava do motor: ok"

  build:
    needs: [test, motor]
    runs-on: windows-latest
    # A escrita mora aqui e só aqui: é o único job que publica release e apaga
    # as antigas.
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # A trava do job `motor` confere que o arquivo foi TOCADO; ninguém confere
      # o que está escrito dentro dele. E o número certo é impossível de saber
      # na hora de escrever: a release é `v2.0.<run_number>`, e o run_number só
      # existe depois do push. Chutar para cima é o erro caro — o app oferece
      # 152 MB, baixa o exe mais novo que existe, continua abaixo do mínimo e
      # pergunta de novo na abertura seguinte. Laço infinito, em todas as
      # máquinas, e a única saída é publicar outra release. Por isso a build
      # para ANTES de publicar.
      - name: Conferir o motor_minimo.txt contra a versão desta release
        run: |
          $release = "v2.0.${{ github.run_number }}"
          $texto = (Get-Content motor_minimo.txt -Raw).Trim()
          try {
            $minimo = [version]($texto.TrimStart('v'))
            $atual  = [version]($release.TrimStart('v'))
          } catch {
            Write-Host "::error::motor_minimo.txt tem '$texto', que nao e uma versao."
            Write-Host "::error::Escreva exatamente $release (ou uma versao anterior)."
            exit 1
          }
          if ($minimo -gt $atual) {
            Write-Host "::error::motor_minimo.txt exige o motor $texto, mas esta"
            Write-Host "::error::release e a ${release}. O motor exigido NUNCA vai"
            Write-Host "::error::existir. O app entraria em laco - oferece 152 MB,"
            Write-Host "::error::baixa, continua abaixo do minimo e pergunta de novo."
            Write-Host "::error::Corrija motor_minimo.txt para $release e suba de novo"
            Write-Host "::error::(lembre que esta build ja consumiu o numero: a"
            Write-Host "::error::proxima release sera a seguinte)."
            exit 1
          }
          Write-Host "motor_minimo.txt = $texto; release = $release - ok"

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          # Versão PRESA: é o PyInstaller quem decide o que entra no exe (e,
          # principalmente, o que fica de fora da biblioteca padrão). Com
          # `pip install pyinstaller` solto, o exe publicado mudava de
          # empacotador sem ninguém pedir, entre duas builds do mesmo código.
          # 6.22.0 é a versão que gerou a v1.0.77.
          pip install pyinstaller==6.22.0 pyinstaller-hooks-contrib==2026.6

      - name: Instalar Tesseract OCR (com português)
        run: |
          choco install tesseract -y --no-progress
          $destino = "C:\Program Files\Tesseract-OCR\tessdata\por.traineddata"
          # `raw.githubusercontent.com` e NAO `github.com/.../raw/...`: o
          # segundo passa pela aplicacao web, que em 17/08/2026 respondeu a
          # PAGINA DE ERRO em HTML com status 200. O `Invoke-WebRequest`
          # gravou o HTML por cima do arquivo de idioma sem reclamar, e a
          # build so morreu depois, no `--list-langs`, com um erro que nao
          # dizia nada sobre download. O CDN serve o arquivo direto.
          $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/por.traineddata"
          Invoke-WebRequest -Uri $url -OutFile $destino -MaximumRetryCount 3 -RetryIntervalSec 10
          # O idioma tem ~1,9 MB; qualquer pagina de erro tem alguns KB. Sem
          # esta conferencia, "baixou HTML" e "baixou o idioma" sao a mesma
          # coisa para o passo seguinte.
          $tamanho = (Get-Item $destino).Length
          if ($tamanho -lt 1MB) {
            throw "por.traineddata veio com $tamanho bytes — e pagina de erro, nao o idioma."
          }
          "por.traineddata: {0:N0} bytes" -f $tamanho
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs
          # `--list-langs` lista o que existe; isto EXIGE o portugues. Sem a
          # exigencia, um exe sem `por` sai da build limpo e so falha no OCR
          # do primeiro comprovante, na maquina de quem usa.
          $langs = & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs 2>&1
          if ($langs -notcontains "por") {
            throw "o Tesseract instalou sem o portugues — o OCR sairia vazio."
          }

      - name: Gravar a versão desta build
        run: |
          "v2.0.${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline versao.txt

      - name: Montar o pacote de código (codigo.zip + cópia embutida)
        run: |
          New-Item -ItemType Directory codigo_embutido | Out-Null
          # Arquivo NOVO na raiz = linha nova aqui. Sem isso o import falha na
          # máquina do usuário e o app não abre (ver CLAUDE.md, regra de ouro).
          # Quem vigia esta lista inteira é tests/test_empacotamento.py.
          Copy-Item comprovantes_app.py, util.py, widgets.py, versao.txt, motor_minimo.txt, icone.ico codigo_embutido/
          New-Item -ItemType Directory codigo_embutido/inicio | Out-Null
          Copy-Item inicio/*.py codigo_embutido/inicio/
          New-Item -ItemType Directory codigo_embutido/separar_renomear | Out-Null
          Copy-Item separar_renomear/*.py codigo_embutido/separar_renomear/
          New-Item -ItemType Directory codigo_embutido/anexar | Out-Null
          Copy-Item anexar/*.py codigo_embutido/anexar/
          New-Item -ItemType Directory codigo_embutido/aportes | Out-Null
          Copy-Item aportes/*.py codigo_embutido/aportes/
          New-Item -ItemType Directory codigo_embutido/relatorios | Out-Null
          Copy-Item relatorios/*.py codigo_embutido/relatorios/
          New-Item -ItemType Directory codigo_embutido/pagamentos_dia | Out-Null
          Copy-Item pagamentos_dia/*.py codigo_embutido/pagamentos_dia/
          New-Item -ItemType Directory codigo_embutido/extratos_sicoob | Out-Null
          Copy-Item extratos_sicoob/*.py codigo_embutido/extratos_sicoob/
          New-Item -ItemType Directory codigo_embutido/conciliacao | Out-Null
          Copy-Item conciliacao/*.py codigo_embutido/conciliacao/
          New-Item -ItemType Directory codigo_embutido/conciliacao/erp | Out-Null
          Copy-Item conciliacao/erp/*.py codigo_embutido/conciliacao/erp/
          New-Item -ItemType Directory codigo_embutido/contratos | Out-Null
          Copy-Item contratos/*.py codigo_embutido/contratos/
          New-Item -ItemType Directory codigo_embutido/acessorias | Out-Null
          Copy-Item acessorias/*.py codigo_embutido/acessorias/
          # cnab240 é o único pacote com DADOS: a parametrização do layout vive
          # em spec/*.json e é lida em runtime. Copiar só os .py faz o pacote
          # importar e estourar na primeira remessa — ver test_cnab240_pacote.py.
          New-Item -ItemType Directory codigo_embutido/cnab240 | Out-Null
          Copy-Item cnab240/*.py codigo_embutido/cnab240/
          New-Item -ItemType Directory codigo_embutido/cnab240/spec | Out-Null
          Copy-Item cnab240/spec/*.json codigo_embutido/cnab240/spec/
          # `nuvem/migrar.py` fica DE FORA de propósito: é ferramenta de uma
          # vez só, rodada à mão na máquina que tem os arquivos bons, como o
          # `aportes/conferir_contas.py`. Ele não é importado pelo app.
          New-Item -ItemType Directory codigo_embutido/baixar_comprovantes | Out-Null
          Copy-Item baixar_comprovantes/*.py codigo_embutido/baixar_comprovantes/
          New-Item -ItemType Directory codigo_embutido/nuvem | Out-Null
          Copy-Item nuvem/*.py -Exclude migrar.py codigo_embutido/nuvem/
          Compress-Archive -Path codigo_embutido/* -DestinationPath codigo.zip
          "codigo.zip: {0:N0} KB" -f ((Get-Item codigo.zip).Length/1KB)

      - name: Gerar "Comprovantes Mais Controle.exe" (motor + código embutido)
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --icon "icone.ico"
          --name "Comprovantes Mais Controle"
          --collect-all playwright
          --collect-all pdfminer
          --collect-all pdfplumber
          --collect-all pypdf
          --collect-all openpyxl
          --collect-all requests
          --collect-all pytesseract
          --collect-all sv_ttk
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --add-data "versao.txt;."
          --add-data "codigo_embutido;codigo_embutido"
          "motor.py"

      # A lacuna estrutural desta esteira: os testes rodam na biblioteca padrão
      # COMPLETA da máquina, e o que chega ao usuário é um exe com a stdlib
      # podada pelo PyInstaller, que só embute o que o `motor.py` faz enxergar.
      # Foi assim que a v1.0.71 caiu (`from tkinter import font`) e é como um
      # `import difflib` novo cairia hoje. Aqui o app é importado DENTRO de um
      # exe com exatamente a mesma poda.
      #
      # Por que um segundo exe, e não o que acabou de ser publicado: o
      # `motor.py` não tem argumento de linha de comando nenhum — rodá-lo abre a
      # janela e fica lá. O truque é que este exe de fumaça tem `import motor` e
      # NADA mais no topo, então o grafo que o PyInstaller monta é o MESMO do exe
      # de verdade; o app é importado depois, em runtime, por nome (o
      # PyInstaller não segue import dinâmico, então nada entra pela porta dos
      # fundos). O dia em que o motor ganhar um `--autoteste`, este passo vira
      # uma linha só, rodando o exe publicado.
      #
      # O que ele NÃO alcança, e vale saber: import escrito DENTRO de função.
      # `aportes/mc_catalogos.py` faz `import difflib` no corpo do método, e
      # importar o módulo não executa o método — esse caso só cai quando a
      # pessoa usa a função. Quem pode guardá-lo é o AST do
      # `tests/test_imports_do_motor.py`, que hoje só compara submódulo de
      # `tkinter` e de `urllib`.
      - name: Preparar o teste de fumaça (a entrada que importa o app)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fumaca.py" <<'PYFIM'
          # -*- coding: utf-8 -*-
          """Entrada do exe de fumaca: importa o app DENTRO da stdlib podada.

          So `motor` no topo, de proposito: e o que faz este exe conter
          exatamente o mesmo que o exe publicado. Tudo que o app importa entra
          por `importlib`, em runtime, e o PyInstaller nao enxerga nada disso.
          Mensagens em ASCII puro: console de exe no Windows nao promete UTF-8.
          """
          import ast
          import importlib
          import sys
          from pathlib import Path

          import motor  # noqa: F401  (nao chamar principal(): abriria a janela)

          # `ast` e usado so aqui e nao existe no exe de verdade. Ele arrasta
          # _ast, enum e contextlib, que o requests ja poe no exe publicado —
          # entao nao ha como ele mascarar a falta de um modulo do app.
          CODIGO = Path(getattr(sys, "_MEIPASS", ".")) / "codigo_embutido"


          def _caminho():
              """A MESMA ordem do motor.principal()."""
              for sub in ("separar_renomear", "anexar", ""):
                  p = str(CODIGO / sub) if sub else str(CODIGO)
                  if p not in sys.path:
                      sys.path.insert(0, p)


          def _modulos():
              """(nome, pasta) de cada .py do pacote, como o app o importa.

              Pasta com __init__.py e pacote (`conciliacao.erp.api`); pasta sem
              __init__.py tem modulo solto, importado pelo nome cru (`config`,
              do anexar) -- nome de modulo e global no sys.path, e e por isso
              que o extratos_sicoob usa o prefixo `sicoob_`.
              """
              for arq in sorted(CODIGO.rglob("*.py")):
                  if arq.name == "__main__.py":     # roda por linha de comando
                      continue
                  partes, pai = [arq.stem], arq.parent
                  while pai != CODIGO and (pai / "__init__.py").is_file():
                      partes.insert(0, pai.name)
                      pai = pai.parent
                  if partes[-1] == "__init__":
                      partes.pop()
                      if not partes:
                          continue
                  yield ".".join(partes), str(pai)


          def _citados():
              """Nomes que aparecem em algum `import` DENTRO do pacote.

              Serve para separar o que o exe pode ALCANCAR do que ele carrega
              sem nunca poder chamar. `conciliacao/cli.py` e o plano B por .bat,
              `aportes/teste_lancamento.py` roda a mao, `nuvem/registro.py`
              ainda esta vazio: ninguem os importa, entao o que falta neles nao
              chega a lugar nenhum. Ja `cnab240` e `conciliacao/erp` tambem nao
              sao importados no arranque, mas SAO importados por outro modulo do
              pacote -- eles entram no primeiro pagamento, e ali a falha custa
              caro. E por isso que a regra e "quem cita quem", e nao "o que o
              comprovantes_app puxa ao abrir".
              """
              nomes = set()
              for arq in sorted(CODIGO.rglob("*.py")):
                  try:
                      arvore = ast.parse(arq.read_text(encoding="utf-8"),
                                         str(arq))
                  except (OSError, SyntaxError):
                      continue
                  for no in ast.walk(arvore):
                      if isinstance(no, ast.Import):
                          for a in no.names:
                              nomes.update(a.name.split("."))
                      elif isinstance(no, ast.ImportFrom):
                          if no.module:
                              nomes.update(no.module.split("."))
                          nomes.update(a.name for a in no.names)
              return nomes


          def principal():
              _caminho()
              citados = _citados()
              # O comprovantes_app vem primeiro: e o import que o usuario paga
              # se falhar, e ele mesmo poe as outras pastas no sys.path.
              alvos = [("comprovantes_app", str(CODIGO))] + list(_modulos())
              faltando, inalcancavel, outros = {}, {}, {}
              for nome, pasta in alvos:
                  if pasta not in sys.path:
                      sys.path.append(pasta)
                  try:
                      importlib.import_module(nome)
                  except ImportError as e:
                      alcancavel = (nome == "comprovantes_app"
                                    or nome.split(".")[-1] in citados)
                      alvo = faltando if alcancavel else inalcancavel
                      alvo[nome] = "%s: %s" % (type(e).__name__, e)
                  except BaseException as e:       # noqa: BLE001
                      outros[nome] = "%s: %s" % (type(e).__name__, e)

              for nome in sorted(inalcancavel):
                  # Ferramenta de linha de comando dentro do zip: nenhum caminho
                  # do exe chega ali, entao falta de modulo nao derruba release.
                  print("AVISO  %s (ninguem o importa) -- %s"
                        % (nome, inalcancavel[nome]))
              for nome in sorted(outros):
                  # Nao e falta de modulo: e o modulo reclamando de ambiente
                  # (arquivo de cadastro que so existe na maquina de quem usa,
                  # por exemplo). Fica registrado, mas nao derruba a release.
                  print("AVISO  %s -- %s" % (nome, outros[nome]))
              if faltando:
                  print("")
                  print("O exe NAO tem modulos que estas partes do app importam:")
                  for nome in sorted(faltando):
                      print("  %s -- %s" % (nome, faltando[nome]))
                  print("")
                  print("E a falha da v1.0.71 (tkinter.font) de novo: o app nao")
                  print("abre, e o erro aparece antes de existir janela. Declare")
                  print("o import no _garantir_dependencias() do motor.py e suba")
                  print("o motor_minimo.txt no MESMO push.")
                  return 1
              print("fumaca: %d modulos importados dentro do exe -- ok"
                    % (len(alvos) - len(inalcancavel) - len(outros)))
              return 0


          if __name__ == "__main__":
              sys.exit(principal())
          PYFIM
          echo "entrada do teste de fumaça gravada em $RUNNER_TEMP/fumaca.py"

      # Os MESMOS --collect-all do exe de verdade: o grafo de módulos tem de
      # bater. `--onedir` e sem o Tesseract porque nada disso muda QUAIS módulos
      # entram — só o formato e o tamanho —, e comprimir 300 MB à toa custa
      # minutos. `--distpath`/`--workpath` próprios para não encostar no
      # `dist/` que já tem o executável a publicar.
      # Este passo roda em PowerShell, e não no bash do passo anterior, porque
      # o `--add-data "origem;destino"` tem ponto e vírgula: o bash do Windows
      # trata argumento com ";" como lista de caminhos e o reescreve no meio do
      # caminho.
      - name: Gerar o exe de fumaça (mesma poda do exe publicado)
        run: >
          pyinstaller --noconfirm --onedir --console
          --name fumaca
          --distpath fumaca_dist --workpath fumaca_build
          --paths .
          --collect-all playwright
          --collect-all pdfminer
          --collect-all pdfplumber
          --collect-all pypdf
          --collect-all openpyxl
          --collect-all requests
          --collect-all pytesseract
          --collect-all sv_ttk
          --add-data "versao.txt;."
          --add-data "codigo_embutido;codigo_embutido"
          "$env:RUNNER_TEMP\fumaca.py"

      # Teto de tempo porque isto abre um exe: import que fique esperando rede
      # (ou uma janela que ninguém pode fechar) travaria a build até o limite de
      # 6 horas do GitHub, gastando minuto de execução por nada.
      - name: Rodar o exe de fumaça (importa o app e as abas)
        timeout-minutes: 10
        run: |
          & ".\fumaca_dist\fumaca\fumaca.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::O exe nao consegue importar o app. Publicar"
            Write-Host "::error::isto entrega um app que nao abre e, pior, manda"
            Write-Host "::error::o codigo.zip novo para quem ja tem o exe."
            Write-Host "::error::Veja acima qual modulo faltou."
            exit 1
          }

      # `prerelease: true` não é detalhe de apresentação: é o PORTÃO.
      # Até aqui, push na main virava release em 4–9 minutos e o
      # `atualizador.py` a instalava sozinho na abertura seguinte — um app que
      # movimenta dinheiro chegava à máquina de quem usa sem ato humano nenhum.
      # A build continua saindo a cada push (GERAR), mas nasce PRÉVIA; quem a
      # torna visível é `.github/workflows/liberar.yml`, à mão, na aba Actions
      # (LIBERAR).
      #
      # Quem faz o filtro do lado do app é a PRÓPRIA API do GitHub: o
      # `/releases/latest`, único endereço por onde o `atualizador.py` escolhe
      # uma release, ignora prerelease e draft por definição. Por isso o
      # atualizador não precisou de uma linha — e é `tests/test_atualizador.py`
      # que prende essa dependência, para ninguém trocar o endpoint por
      # `/releases` (a LISTA, que traz prévia junto) sem perceber que está
      # abrindo o portão.
      - name: Publicar Release com o executável (como prévia)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Executável v2.0.${{ github.run_number }}
          prerelease: true
          body: |
            **Prévia** — gerada pelo push, ainda NÃO liberada. Nenhum app baixa
            uma prévia: só depois de rodar o workflow "Liberar uma versão para
            os usuários" (aba Actions) com esta tag ela passa a ser a `latest`.

            Executável para Windows — não precisa de Python instalado.
            Requisito: Google Chrome instalado (usado pela aba Anexar Comprovantes).

            - **Comprovantes Mais Controle.exe** — o app, com tudo em abas
              (Separar e Renomear, Anexar Comprovantes e Conferência)
            - codigo.zip — pacote de atualização leve (o app baixa sozinho, ignore)

            Depois de liberada, o app se atualiza sozinho ao abrir: baixa só o
            código novo (segundos). Dica: coloque o .exe numa pasta própria; o
            perfil do Chrome (login salvo) e os logs são criados ao lado do
            executável.
          files: |
            dist/Comprovantes Mais Controle.exe
            codigo.zip

      # O app busca as releases no repositório de ARTEFATOS, não aqui. Este
      # continua publicando a sua (é o arquivo histórico, e é o que as máquinas
      # com exe anterior ainda enxergam durante a transição); o de artefatos é
      # o que os exes novos consultam, e é público justamente porque a chamada
      # do atualizador é anônima.
      #
      # Precisa de um token com escrita NO OUTRO repositório: o `github.token`
      # só vale para este. Enquanto o segredo não existir, o passo é pulado e a
      # build continua verde — publicar aqui já entrega a release de hoje.
      # O `if` testa uma variável de ambiente, e não `secrets` direto: o
      # contexto `secrets` não existe em `if:` de passo, e a expressão falha na
      # validação do workflow inteiro em vez de só pular o passo.
      # Sem `if:` de propósito. Ele existia para "pular quando não há token", e
      # foi exatamente esse pulo silencioso que deixou os apps órfãos por três
      # dias em agosto/2026. Quem garante o token agora é o job `motor`, que
      # falha em segundos quando ele falta — aqui, se der errado, tem de doer.
      - name: Publicar a mesma Release no repositório de artefatos (como prévia)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          repository: gdiascabral/comprovantes-releases
          token: ${{ secrets.TOKEN_ARTEFATOS }}
          tag_name: v2.0.${{ github.run_number }}
          name: Executável v2.0.${{ github.run_number }}
          # Prévia AQUI TAMBÉM, e este é o que importa: é neste repositório que
          # o app procura (a constante `REPO` do atualizador.py). Fechar o
          # portão só no repositório de código deixaria a release entrando
          # sozinha justamente onde os usuários olham — e o `liberar.yml`, por
          # isso mesmo, libera os DOIS.
          prerelease: true
          body: |
            **Prévia** — ainda NÃO liberada. Nenhum app baixa uma prévia:
            só depois do workflow "Liberar uma versão para os usuários"
            (aba Actions do repositório de código) ela vira a `latest`.

            Executável para Windows — não precisa de Python instalado.
            Requisito: Google Chrome instalado (usado pela aba Anexar Comprovantes).

            Depois de liberada, o app se atualiza sozinho ao abrir: baixa só o
            `codigo.zip` (segundos). O executável completo só é oferecido
            quando entra biblioteca nova.

            Para testar esta prévia numa máquina só, ANTES de liberar: crie
            `travar_versao.txt` ao lado do executável com esta tag dentro. A
            trava busca a release pela TAG (`/releases/tags/…`), então enxerga
            prévia; é também assim que se volta de uma release ruim.
          files: |
            dist/Comprovantes Mais Controle.exe
            codigo.zip

      # Reter por TEMPO, com um piso de contagem. "As 4 mais novas" foi pensado
      # para rollback, e num dia de muitos pushes virava 70 minutos de
      # histórico: a versão boa de ontem já não existia mais. O piso continua
      # valendo para o caso contrário — um mês parado não pode deixar o
      # repositório sem release nenhuma para voltar.
      #
      # Com o portão, uma lista só deixou de servir. Antes toda release era
      # liberada e ordenar por data bastava; agora convivem duas categorias, e
      # um piso único conta as prévias como se fossem versões em uso. O caso
      # que isso quebra é o pior possível: uma semana de pushes sem liberar
      # nada põe 4 prévias no topo, a última LIBERADA (a que está rodando na
      # máquina de todo mundo) cai para a 5ª posição e, passados os 30 dias,
      # some — junto com o caminho de volta, que é o motivo de a poda ter um
      # piso. Por isso cada categoria é podada com o piso e a janela DELA.
      #
      # E a prévia tem uma regra a mais: só entra na poda depois de ter sido
      # ULTRAPASSADA por uma liberada mais nova. Aí ela é prévia morta —
      # ninguém libera uma versão anterior à que já está em produção. Prévia
      # que ainda pode virar a próxima versão fica, tenha a idade que tiver:
      # apagar o que está esperando o dono decidir seria o portão comendo
      # justamente o que ele guarda.
      #
      # A data continua sendo `created_at`, como sempre foi neste passo, e vale
      # saber o que ela é: a data do COMMIT que a tag aponta, não a da
      # publicação. Duas releases do mesmo commit empatam (v2.0.117 e v2.0.118
      # empatam hoje), e no empate a prévia conta como não-ultrapassada e fica.
      # O erro cai para o lado de guardar demais, que é o lado certo.
      - name: Limpar releases antigas (30 dias, e nunca menos de 4 de cada)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $MANTER = 4
          $DIAS = 30
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $limite = (Get-Date).ToUniversalTime().AddDays(-$DIAS)

          function Podaveis($lista) {
            # A regra de sempre, aplicada DENTRO de uma categoria.
            $lista |
              Sort-Object -Property @{Expression={[datetime]$_.created_at}} -Descending |
              Select-Object -Skip $MANTER |
              Where-Object { ([datetime]$_.created_at).ToUniversalTime() -lt $limite }
          }

          # `draft` anda junto com `prerelease` porque o atualizador as ignora
          # pelo mesmo motivo: o `/releases/latest` nao enxerga nem uma nem outra.
          $liberadas = @($rels | Where-Object { -not $_.prerelease -and -not $_.draft })
          $previas   = @($rels | Where-Object { $_.prerelease -or $_.draft })
          Write-Host "releases: $($liberadas.Count) liberadas, $($previas.Count) previas"

          $velhas = @(Podaveis $liberadas)

          $marco = $liberadas |
            Sort-Object -Property @{Expression={[datetime]$_.created_at}} -Descending |
            Select-Object -First 1
          if ($marco) {
            $corte = ([datetime]$marco.created_at).ToUniversalTime()
            $ultrapassadas = @($previas | Where-Object {
              ([datetime]$_.created_at).ToUniversalTime() -lt $corte })
            $velhas += @(Podaveis $ultrapassadas)
          } else {
            # Nada liberado ainda: nenhuma previa foi ultrapassada, entao nao ha
            # previa morta. E o estado logo depois de ligar o portao.
            Write-Host "nenhuma release liberada ainda - nenhuma previa e podada"
          }

          if (-not $velhas) {
            Write-Host "nada a apagar: nenhuma release fora dos $DIAS dias, alem das $MANTER mais novas de cada categoria"
          }
          foreach ($r in $velhas) {
            $tipo = if ($r.prerelease -or $r.draft) { "previa ultrapassada" } else { "liberada" }
            Write-Host "Apagando release $($r.tag_name) ($tipo, de $($r.created_at))"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)"
            try { gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$($r.tag_name)" } catch { Write-Host "  (tag já removida)" }
          }
