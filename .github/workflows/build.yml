name: Gerar o executável (Windows)

on:
  workflow_dispatch:      # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CLAUDE.md"
      - "requirements-dev.txt"
      # "tests/**" NÃO entra aqui: mudança em teste tem que disparar a build,
      # senão o job `test` abaixo nunca roda justamente no push que o alterou.

permissions:
  contents: write         # necessário para publicar a Release

jobs:
  # A build publica uma release que os usuários baixam sozinhos ao abrir o app.
  # Testar DEPOIS disso não serve para nada, então o build depende deste job.
  test:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest tests -q

  motor:
    # Código novo rodando em motor velho quebra na máquina do usuário, e a
    # falha aparece longe daqui. Ver CLAUDE.md, "Regra de ouro".
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Exigir motor_minimo.txt quando o motor muda
        shell: bash
        run: |
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then
            echo "primeiro commit — nada a comparar"; exit 0
          fi
          mudou="$(git diff --name-only HEAD~1 HEAD)"
          echo "Arquivos deste push:"; echo "$mudou"
          exige=0
          for f in motor.py atualizador.py requirements.txt .github/workflows/build.yml; do
            if echo "$mudou" | grep -qx "$f"; then
              echo "::notice::'$f' mudou — exige motor_minimo.txt novo"
              exige=1
            fi
          done
          if [ "$exige" = "1" ] && ! echo "$mudou" | grep -qx "motor_minimo.txt"; then
            echo "::error::Este push altera o MOTOR mas não sobe motor_minimo.txt."
            echo "::error::Sem isso, o código novo roda em motor velho na máquina"
            echo "::error::do usuário e quebra. Suba motor_minimo.txt para a versão"
            echo "::error::desta release (v1.0.<run_number>) no MESMO push."
            exit 1
          fi
          echo "trava do motor: ok"

  build:
    needs: [test, motor]
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar Tesseract OCR (com português)
        run: |
          choco install tesseract -y --no-progress
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile "C:\Program Files\Tesseract-OCR\tessdata\por.traineddata"
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs

      - name: Gravar a versão desta build
        run: |
          "v1.0.${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline versao.txt

      - name: Montar o pacote de código (codigo.zip + cópia embutida)
        run: |
          New-Item -ItemType Directory codigo_embutido | Out-Null
          # Arquivo NOVO na raiz = linha nova aqui. Sem isso o import falha na
          # máquina do usuário e o app não abre (ver CLAUDE.md, regra de ouro).
          Copy-Item comprovantes_app.py, util.py, widgets.py, ativacao.py, versao.txt, motor_minimo.txt, icone.ico codigo_embutido/
          New-Item -ItemType Directory codigo_embutido/separar_renomear | Out-Null
          Copy-Item separar_renomear/*.py codigo_embutido/separar_renomear/
          New-Item -ItemType Directory codigo_embutido/anexar | Out-Null
          Copy-Item anexar/*.py codigo_embutido/anexar/
          New-Item -ItemType Directory codigo_embutido/aportes | Out-Null
          Copy-Item aportes/*.py codigo_embutido/aportes/
          New-Item -ItemType Directory codigo_embutido/relatorios | Out-Null
          Copy-Item relatorios/*.py codigo_embutido/relatorios/
          New-Item -ItemType Directory codigo_embutido/pagamentos_dia | Out-Null
          Copy-Item pagamentos_dia/*.py codigo_embutido/pagamentos_dia/
          New-Item -ItemType Directory codigo_embutido/extratos_sicoob | Out-Null
          Copy-Item extratos_sicoob/*.py codigo_embutido/extratos_sicoob/
          New-Item -ItemType Directory codigo_embutido/conciliacao | Out-Null
          Copy-Item conciliacao/*.py codigo_embutido/conciliacao/
          New-Item -ItemType Directory codigo_embutido/conciliacao/erp | Out-Null
          Copy-Item conciliacao/erp/*.py codigo_embutido/conciliacao/erp/
          New-Item -ItemType Directory codigo_embutido/contratos | Out-Null
          Copy-Item contratos/*.py codigo_embutido/contratos/
          New-Item -ItemType Directory codigo_embutido/acessorias | Out-Null
          Copy-Item acessorias/*.py codigo_embutido/acessorias/
          # cnab240 é o único pacote com DADOS: a parametrização do layout vive
          # em spec/*.json e é lida em runtime. Copiar só os .py faz o pacote
          # importar e estourar na primeira remessa — ver test_cnab240_pacote.py.
          New-Item -ItemType Directory codigo_embutido/cnab240 | Out-Null
          Copy-Item cnab240/*.py codigo_embutido/cnab240/
          New-Item -ItemType Directory codigo_embutido/cnab240/spec | Out-Null
          Copy-Item cnab240/spec/*.json codigo_embutido/cnab240/spec/
          Compress-Archive -Path codigo_embutido/* -DestinationPath codigo.zip
          "codigo.zip: {0:N0} KB" -f ((Get-Item codigo.zip).Length/1KB)

      - name: Gerar "Comprovantes Mais Controle.exe" (motor + código embutido)
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --icon "icone.ico"
          --name "Comprovantes Mais Controle"
          --collect-all playwright
          --collect-all pdfminer
          --collect-all pdfplumber
          --collect-all pypdf
          --collect-all openpyxl
          --collect-all requests
          --collect-all pytesseract
          --collect-all sv_ttk
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --add-data "versao.txt;."
          --add-data "codigo_embutido;codigo_embutido"
          "motor.py"

      - name: Publicar Release com o executável
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Executável v1.0.${{ github.run_number }}
          body: |
            Executável para Windows — não precisa de Python instalado.
            Requisito: Google Chrome instalado (usado pela aba Anexar Comprovantes).

            - **Comprovantes Mais Controle.exe** — o app, com tudo em abas
              (Separar e Renomear, Anexar Comprovantes e Conferência)
            - codigo.zip — pacote de atualização leve (o app baixa sozinho, ignore)

            O app se atualiza sozinho ao abrir: baixa só o código novo
            (segundos). Dica: coloque o .exe numa pasta própria; o perfil do
            Chrome (login salvo) e os logs são criados ao lado do executável.
          files: |
            dist/Comprovantes Mais Controle.exe
            codigo.zip

      - name: Limpar releases antigas (mantém as 4 mais novas p/ rollback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $velhas = $rels | Sort-Object -Property @{Expression={[datetime]$_.created_at}} -Descending | Select-Object -Skip 4
          foreach ($r in $velhas) {
            Write-Host "Apagando release $($r.tag_name)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)"
            try { gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$($r.tag_name)" } catch { Write-Host "  (tag já removida)" }
          }
