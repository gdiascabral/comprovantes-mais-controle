name: Gerar executáveis (Windows)

on:
  workflow_dispatch:      # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"

permissions:
  contents: write         # necessário para publicar a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar Tesseract OCR (com português)
        run: |
          choco install tesseract -y --no-progress
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile "C:\Program Files\Tesseract-OCR\tessdata\por.traineddata"
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs

      - name: Gerar "Separar e Renomear.exe"
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name "Separar e Renomear"
          --collect-all pdfminer
          --collect-all pdfplumber
          --collect-all sv_ttk
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          "separar_renomear/separar_renomear.py"

      - name: Gerar "Anexar Comprovantes.exe"
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name "Anexar Comprovantes"
          --collect-all playwright
          --collect-all sv_ttk
          "anexar/anexar_comprovantes.py"

      - name: Gravar a versão desta build
        run: |
          "v1.0.${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline versao.txt

      - name: Montar o pacote de código (codigo.zip + cópia embutida)
        run: |
          New-Item -ItemType Directory codigo_embutido | Out-Null
          Copy-Item comprovantes_app.py, versao.txt, motor_minimo.txt codigo_embutido/
          New-Item -ItemType Directory codigo_embutido/separar_renomear | Out-Null
          Copy-Item separar_renomear/*.py codigo_embutido/separar_renomear/
          New-Item -ItemType Directory codigo_embutido/anexar | Out-Null
          Copy-Item anexar/*.py codigo_embutido/anexar/
          Compress-Archive -Path codigo_embutido/* -DestinationPath codigo.zip
          "codigo.zip: {0:N0} KB" -f ((Get-Item codigo.zip).Length/1KB)

      - name: Gerar "Comprovantes Mais Controle.exe" (motor + código embutido)
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name "Comprovantes Mais Controle"
          --collect-all playwright
          --collect-all pdfminer
          --collect-all pdfplumber
          --collect-all pypdf
          --collect-all openpyxl
          --collect-all requests
          --collect-all pytesseract
          --collect-all sv_ttk
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --add-data "versao.txt;."
          --add-data "codigo_embutido;codigo_embutido"
          "motor.py"

      - name: Publicar Release com os executáveis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Executáveis v1.0.${{ github.run_number }}
          body: |
            Executáveis para Windows — não precisam de Python instalado.
            Requisito: Google Chrome instalado (usado pelo Anexar Comprovantes).

            - **Comprovantes Mais Controle.exe** — app completo, com os dois em abas (recomendado)
            - **Separar e Renomear.exe** — só o App 1
            - **Anexar Comprovantes.exe** — só o App 2
            - codigo.zip — pacote de atualização leve (o app baixa sozinho, ignore)

            O app completo se atualiza sozinho ao abrir: baixa só o código novo
            (segundos). Dica: coloque o .exe numa pasta própria; o perfil do
            Chrome (login salvo) e os logs são criados ao lado do executável.
          files: |
            dist/Comprovantes Mais Controle.exe
            dist/Separar e Renomear.exe
            dist/Anexar Comprovantes.exe
            codigo.zip
